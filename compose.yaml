services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: telesale-agent-local:free
    ports:
      - "8000:10000"
    environment:
      PORT: "10000"
      WEB_ORIGIN: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      REALTIME_ALLOWED_ORIGINS: http://localhost:3000
      CUSTOMER_MEMORY_BACKEND: file
      KNOWLEDGE_MCP_PREWARM: "false"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
