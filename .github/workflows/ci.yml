name: CI

on:
  push:
    branches: [deployment]
  pull_request:
    branches: [deployment]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev,voice,realtime]"
      - name: Run backend tests
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  sync-blueprint:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync Render Blueprint after CI passes
        env:
          RENDER_BLUEPRINT_SYNC_HOOK: ${{ secrets.RENDER_BLUEPRINT_SYNC_HOOK }}
        run: |
          if [ -z "$RENDER_BLUEPRINT_SYNC_HOOK" ]; then
            echo "::error::Set RENDER_BLUEPRINT_SYNC_HOOK in GitHub Actions secrets"
            exit 1
          fi
          curl --fail --show-error --silent "$RENDER_BLUEPRINT_SYNC_HOOK"

  deploy-vercel:
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_API_BASE_URL: https://telesale-agent-api-3no2.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Vercel credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in GitHub Actions secrets"
              exit 1
            fi
          done
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Deploy frontend to Vercel Production
        run: |
          vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL" \
            --env "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL"
